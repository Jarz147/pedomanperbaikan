<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Manual Book & Troubleshooting Log</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        #book-wrapper {
            width: 900px;
            height: 550px;
        }
        .page {
            width: 450px;
            height: 550px;
            background: #fcfbf9;
            box-shadow: inset 3px 0 10px rgba(0,0,0,0.05), inset -3px 0 10px rgba(0,0,0,0.05);
        }
        .hard {
            background: #1e293b !important;
            color: white;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 flex flex-col justify-between font-sans">

    <header class="p-4 bg-slate-900/50 backdrop-blur-md border-b border-slate-800 flex justify-between items-center px-8">
        <div class="flex items-center gap-3">
            <span class="text-2xl">📖</span>
            <h1 class="text-lg font-bold tracking-wider text-indigo-400">LOG-BOOK // DIGITAL MANUAL</h1>
        </div>
        
        <div class="flex items-center gap-4 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700 text-sm">
            <button id="btn-reader" onclick="switchRole('reader')" class="px-4 py-1.5 rounded-lg font-medium transition-all bg-indigo-600 text-white shadow-lg">Reader</button>
            <button id="btn-writer" onclick="switchRole('writer')" class="px-4 py-1.5 rounded-lg font-medium transition-all text-slate-400 hover:text-slate-200">Writer</button>
        </div>
    </header>

    <div class="max-w-5xl w-full mx-auto px-4 mt-6 flex justify-between items-center">
        <div class="relative w-72">
            <input type="text" id="search-input" onkeyup="searchBook()" placeholder="Cari masalah atau kode error..." class="w-full bg-slate-800/60 border border-slate-700 rounded-xl py-2 pl-4 pr-10 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            <span class="absolute right-3 top-2.5 text-slate-500">🔍</span>
        </div>
        
        <button id="add-log-btn" onclick="openModal('add')" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-sm shadow-lg shadow-indigo-600/20 items-center gap-2 transition-all">
            <span>➕</span> Tambah Masalah Baru
        </button>
    </div>

    <main class="flex-grow flex items-center justify-center p-4">
        <div id="book-wrapper" class="bg-slate-950 rounded-2xl overflow-hidden shadow-2xl shadow-black/50">
            <div id="book">
                <div class="hard flex flex-col justify-between p-12 text-center border-r border-slate-950">
                    <div class="mt-8">
                        <span class="text-xs font-semibold tracking-widest text-indigo-400 uppercase">System Maintenance</span>
                        <h2 class="text-3xl font-extrabold mt-2 tracking-tight">KUMPULAN LOG MASALAH & SOLUSI</h2>
                        <div class="w-16 h-1 bg-indigo-500 mx-auto mt-6 rounded-full"></div>
                    </div>
                    <p class="text-xs text-slate-400">Klik ujung halaman atau gunakan tombol di bawah untuk membuka buku</p>
                </div>

                <div class="page p-10 text-slate-800 flex flex-col justify-between">
                    <div>
                        <h3 class="text-xl font-bold border-b-2 border-slate-200 pb-3 text-slate-900 tracking-tight">Daftar Isi</h3>
                        <ul id="table-of-contents" class="mt-6 space-y-3 text-sm font-medium text-slate-600">
                            </ul>
                    </div>
                    <span class="text-xs text-slate-400 font-mono text-center">Hal. 1</span>
                </div>
            </div>
        </div>
    </main>

    <div class="flex justify-center items-center gap-6 mb-8 text-sm">
        <button onclick="prevPage()" class="bg-slate-800/80 border border-slate-700 hover:bg-slate-700 px-4 py-2 rounded-xl transition-colors">◀ Sebelumnya</button>
        <span id="page-number" class="font-mono text-slate-400">Halaman: 1</span>
        <button onclick="nextPage()" class="bg-slate-800/80 border border-slate-700 hover:bg-slate-700 px-4 py-2 rounded-xl transition-colors">Selanjutnya ▶</button>
    </div>

    <div id="writer-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-100">Tambah Dokumentasi Kasus</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 text-xl">&times;</button>
            </div>
            <form id="log-form" onsubmit="handleFormSubmit(event)" class="space-y-4 text-sm text-slate-300">
                <input type="hidden" id="form-edit-id" value="">
                <div>
                    <label class="block font-medium mb-1">Judul Masalah / Kode Error</label>
                    <input type="text" id="form-title" required placeholder="Contoh: Overheat pada Motor Konveyor Utama" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block font-medium mb-1">Kategori / Lokasi / Mesin</label>
                    <input type="text" id="form-category" required placeholder="Contoh: Assembly Line 2 / Inverter" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block font-medium mb-1">Deskripsi & Gejala Masalah</label>
                    <textarea id="form-problem" rows="3" required placeholder="Jelaskan kondisi mesin saat error terjadi..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 focus:outline-none focus:border-indigo-500 no-scrollbar"></textarea>
                </div>
                <div>
                    <label class="block font-medium mb-1">Langkah Solusi / Perbaikan</label>
                    <textarea id="form-solution" rows="4" required placeholder="Langkah-langkah penanganan..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 focus:outline-none focus:border-indigo-500 no-scrollbar"></textarea>
                </div>
                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl">Batal</button>
                    <button type="submit" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl font-medium shadow-lg">Simpan ke Buku</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Kredensial Supabase Anda
        const SUPABASE_URL = 'https://neapdsjsqpcsxhxjwyik.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lYXBkc2pzcXBjc3hoeGp3eWlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0Nzg0NjgsImV4cCI6MjA5NDA1NDQ2OH0.0MK6HwbDBA9jTj-_ESGvs-ErCvcnQqlqAVGqEv_gG-w';
        
        // Menggunakan variabel 'supabaseClient' agar tidak bertabrakan dengan object bawaan CDN global
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let database = [];
        let currentRole = 'reader';

        $(document).ready(function() {
            fetchDataFromSupabase();
        });

        // Ambil Data Nyata dari Supabase
        async function fetchDataFromSupabase() {
            try {
                let { data, error } = await supabaseClient
                    .from('troubleshooting_logs')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) throw error;

                database = data || [];
                initBook();
            } catch (err) {
                console.error("Detail Error Supabase:", err.message || err);
                alert("Koneksi Database Supabase Gagal! Periksa setelan RLS di Dashboard Supabase.");
                database = [];
                initBook();
            }
        }

        // Setup & Inisialisasi Turn.js Pertama Kali
        function initBook() {
            renderPagesFromDatabase();
            updateTableOfContents();
            
            $('#book').turn({
                width: 900,
                height: 550,
                acceleration: true,
                gradients: true,
                elevation: 50,
                when: {
                    turned: function(e, page) { 
                        $('#page-number').text("Halaman: " + page); 
                    }
                }
            });
            checkRoleUI();
        }

        // Fungsi Membangun Ulang Buku secara Aman saat data berubah (Insert / Update)
        function rebuildBook(targetPage = 1) {
            const initialPagesHTML = `
                <div class="hard flex flex-col justify-between p-12 text-center border-r border-slate-950">
                    <div class="mt-8">
                        <span class="text-xs font-semibold tracking-widest text-indigo-400 uppercase">System Maintenance</span>
                        <h2 class="text-3xl font-extrabold mt-2 tracking-tight">KUMPULAN LOG MASALAH & SOLUSI</h2>
                        <div class="w-16 h-1 bg-indigo-500 mx-auto mt-6 rounded-full"></div>
                    </div>
                    <p class="text-xs text-slate-400">Klik ujung halaman atau gunakan tombol di bawah untuk membuka buku</p>
                </div>
                <div class="page p-10 text-slate-800 flex flex-col justify-between">
                    <div>
                        <h3 class="text-xl font-bold border-b-2 border-slate-200 pb-3 text-slate-900 tracking-tight">Daftar Isi</h3>
                        <ul id="table-of-contents" class="mt-6 space-y-3 text-sm font-medium text-slate-600"></ul>
                    </div>
                    <span class="text-xs text-slate-400 font-mono text-center">Hal. 1</span>
                </div>
            `;
            
            $('#book').turn('destroy');
            $('#book-wrapper').html('<div id="book">' + initialPagesHTML + '</div>');
            
            initBook();

            setTimeout(() => { jumpToPage(targetPage); }, 150);
        }

        function renderPagesFromDatabase() {
            database.forEach((item, index) => {
                let pageNumberLeft = (index * 2) + 2;
                let pageNumberRight = (index * 2) + 3;

                let pageLeftHTML = `
                    <div class="page p-10 text-slate-800 flex flex-col justify-between border-r border-slate-200">
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="inline-block bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-md mb-3">${item.category}</span>
                                <button onclick="openModal('edit', ${index})" class="writer-action hidden text-xs font-semibold text-amber-600 bg-amber-50 hover:bg-amber-100 px-2.5 py-1 rounded-md transition-colors">✏️ Edit Log</button>
                            </div>
                            <h4 class="text-lg font-bold text-slate-900 leading-tight">${item.title}</h4>
                            <div class="mt-5">
                                <h5 class="text-xs font-bold tracking-wider uppercase text-red-600">⚠️ Detail Gejala Masalah:</h5>
                                <p class="text-sm text-slate-600 mt-1.5 leading-relaxed">${item.problem.replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                        <span class="text-xs text-slate-400 font-mono text-left">Hal. ${pageNumberLeft}</span>
                    </div>
                `;

                let pageRightHTML = `
                    <div class="page p-10 text-slate-800 flex flex-col justify-between">
                        <div>
                            <h5 class="text-xs font-bold tracking-wider uppercase text-emerald-600">✅ Langkah Perbaikan / Solusi:</h5>
                            <p class="text-sm text-slate-700 mt-2 font-medium leading-relaxed">${item.solution.replace(/\n/g, '<br>')}</p>
                        </div>
                        <div class="flex justify-between items-center border-t border-slate-100 pt-3">
                            <span class="text-[10px] text-slate-400">Sistem Log Digital</span>
                            <span class="text-xs text-slate-400 font-mono">Hal. ${pageNumberRight}</span>
                        </div>
                    </div>
                `;

                $('#book').append(pageLeftHTML).append(pageRightHTML);
            });
        }

        function updateTableOfContents() {
            let listContainer = $('#table-of-contents');
            listContainer.empty();

            database.forEach((item, index) => {
                let targetPage = (index * 2) + 2;
                listContainer.append(`
                    <li class="flex justify-between items-baseline cursor-pointer hover:text-indigo-600 transition-colors" onclick="jumpToPage(${targetPage})">
                        <span class="truncate pr-2">${item.title}</span>
                        <span class="border-b border-dashed border-slate-300 flex-grow"></span>
                        <span class="font-mono pl-2 text-slate-400">Hal. ${targetPage}</span>
                    </li>
                `);
            });
        }

        function jumpToPage(pageNumber) { $('#book').turn('page', pageNumber); }
        function prevPage() { $('#book').turn('previous'); }
        function nextPage() { $('#book').turn('next'); }

        function switchRole(role) {
            currentRole = role;
            if(role === 'writer') {
                $('#btn-writer').addClass('bg-indigo-600 text-white shadow-lg').removeClass('text-slate-400');
                $('#btn-reader').removeClass('bg-indigo-600 text-white shadow-lg').addClass('text-slate-400');
            } else {
                $('#btn-reader').addClass('bg-indigo-600 text-white shadow-lg').removeClass('text-slate-400');
                $('#btn-writer').removeClass('bg-indigo-600 text-white shadow-lg').addClass('text-slate-400');
            }
            checkRoleUI();
        }

        function checkRoleUI() {
            if(currentRole === 'writer') {
                $('#add-log-btn').removeClass('hidden').addClass('flex');
                $('.writer-action').removeClass('hidden').addClass('block');
            } else {
                $('#add-log-btn').addClass('hidden').removeClass('flex');
                $('.writer-action').addClass('hidden').removeClass('block');
            }
        }

        function searchBook() {
            let query = $('#search-input').val().toLowerCase();
            if(query.trim() === "") return;

            let foundIndex = database.findIndex(item => 
                item.title.toLowerCase().includes(query) || 
                item.problem.toLowerCase().includes(query) || 
                item.category.toLowerCase().includes(query)
            );

            if (foundIndex !== -1) {
                let targetPage = (foundIndex * 2) + 2;
                jumpToPage(targetPage);
            }
        }

        function openModal(mode, index = null) {
            if (mode === 'edit' && index !== null) {
                let targetData = database[index];
                $('#modal-title').text('✏️ Edit Dokumentasi Kasus');
                $('#submit-btn').text('Perbarui Halaman');
                $('#form-edit-id').val(targetData.id); 
                
                $('#form-title').val(targetData.title);
                $('#form-category').val(targetData.category);
                $('#form-problem').val(targetData.problem);
                $('#form-solution').val(targetData.solution);
            } else {
                $('#modal-title').text('➕ Tambah Dokumentasi Kasus');
                $('#submit-btn').text('Simpan ke Buku');
                $('#form-edit-id').val(''); 
                $('#log-form')[0].reset();
            }
            $('#writer-modal').removeClass('hidden').addClass('flex');
        }

        function closeModal() { $('#writer-modal').addClass('hidden').removeClass('flex'); }

        // Handler Submit untuk Simpan & Ubah Data Cloud Supabase
        async function handleFormSubmit(e) {
            e.preventDefault();
            let logId = $('#form-edit-id').val();

            let logData = {
                title: $('#form-title').val(),
                category: $('#form-category').val(),
                problem: $('#form-problem').val(),
                solution: $('#form-solution').val()
            };

            closeModal();

            if (logId !== "") {
                // Proses Aksi EDIT (Update)
                let { error } = await supabaseClient
                    .from('troubleshooting_logs')
                    .update(logData)
                    .eq('id', logId);

                if (!error) {
                    let idx = database.findIndex(item => item.id == logId);
                    database[idx] = { ...database[idx], ...logData };
                    rebuildBook((idx * 2) + 2);
                } else {
                    alert("Gagal memperbarui data di Supabase!");
                }
            } else {
                // Proses Aksi TAMBAH BARU (Insert)
                let { data, error } = await supabaseClient
                    .from('troubleshooting_logs')
                    .insert([logData])
                    .select();

                if (!error && data) {
                    database.push(data[0]);
                    rebuildBook(database.length * 2);
                } else {
                    alert("Gagal menyimpan data baru ke Supabase!");
                }
            }
        }
    </script>
</body>
</html>
